[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dva"
version = "0.1.0"
description = "Data validation agent: checks customer data files against an internal data model."
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.17",
    "langgraph-checkpoint-sqlite==3.1.2",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-anthropic==1.7.6",
    "pydantic==2.14.1",
    "pandas==3.1.0",
    "numpy==2.4.6",
    "pyarrow==26.0.0",
    "openpyxl==3.1.5",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.4",
    "typer==0.27.3",
    "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[project.scripts]
dva = "dva.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/dva"]
pythonpath = ["tests/dva"]
# Stop conftest discovery at tests/dva so the legacy tests/conftest.py is never loaded.
addopts = "--confcutdir=tests/dva --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests/dva", "scripts", "evals"]
# Legacy EDA agent code is left untouched until Phase 9.
extend-exclude = [
    "core", "graph", "memory", "adapters", "outputs", "run.py",
    "tests/unit", "tests/integration", "tests/conftest.py", "tests/__init__.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
